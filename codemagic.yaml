workflows:
  android-debug:
    name: Android Debug Build
    max_build_duration: 60
    environment:
      node: 18
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Add Android platform
        script: |
          npx cap add android || true
      - name: Sync Android
        script: |
          npx cap sync android
      - name: Build Android
        script: |
          cd android
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk
