workflows:
  android-debug:
    name: Android Debug Build
    max_build_duration: 60
    environment:
      vars:
        CM_KEYSTORE_PATH: ""
      android_signing:
        - keystore_reference: ""
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Build Android
        script: |
          npx cap sync android
          cd android
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk
