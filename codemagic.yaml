workflows:
  android-debug:
    name: Android Debug APK
    max_build_duration: 60
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Build Android
        script: |
          npx cap sync android
          cd android
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk
