<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ti'Doc — Galerie</title>
  <link rel="stylesheet" href="style.css?v=203">

  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#178CA8">

  <!-- Protège la page (redirige si pas connecté) -->
  <script type="module">
    import { requireAuthOrRedirect } from "./auth.js";
    requireAuthOrRedirect("./login.html");
  </script>
</head>

<body>

  <!-- ✅ Topbar + menu profil (avatar + cloche + pseudo + couronne) -->
  <script type="module" src="./header-user-menu.js"></script>

  <main class="page blog-page">
    <!-- Année -->
    <div class="gallery-years">
      <button class="year-btn active" type="button" data-year="2025">Ti’Doc 2025</button>
      <button class="year-btn" type="button" data-year="2026">Ti’Doc 2026</button>
    </div>

    <!-- ✅ Admin only (caché par défaut, affiché par galerie.js si admin) -->
    <button class="create-post" id="addPhotosBtn" type="button" style="display:none;">
      <span class="create-post-plus">＋</span>
      <span>Ajouter des photos</span>
    </button>

    <!-- Grille -->
    <section class="gallery-grid" id="galleryGrid"></section>
  </main>

  <!-- Menu du bas -->
  <nav class="tabbar">
    <a class="tab" href="index.html" aria-label="Accueil">...</a>
    <a class="tab" href="blog.html" aria-label="Forum">...</a>
    <a class="tab active" href="galerie.html" aria-label="Galerie">...</a>
    <a class="tab" href="evenements.html" aria-label="Événements">...</a>
    <a class="tab" href="billets.html" aria-label="Billets">...</a>
  </nav>

  <!-- ✅ Cloudinary Upload Widget (OBLIGATOIRE) -->
  <script src="https://widget.cloudinary.com/v2.0/global/all.js"></script>

  <!-- ✅ Galerie (upload + delete + download + année) -->
  <script type="module" src="./galerie.js?v=203"></script>

  <!-- PWA si tu veux -->
  <script src="pwa.js"></script>

</body>
</html>
