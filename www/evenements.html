<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ti'Doc — Événements</title>

  <link rel="stylesheet" href="style.css?v=2" />
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#178CA8">

  <!-- protège la page (redirige si pas connecté) -->
  <script type="module">
    import { requireAuthOrRedirect } from "./auth.js";
    requireAuthOrRedirect("./login.html");
  </script>
</head>

<body>
  <!-- ✅ Topbar bleue injectée automatiquement -->
  <script type="module" src="./header-user-menu.js"></script>

  <main class="page blog-page">

    <!-- Admin only (affiché par evenements.js si admin) -->
    <button class="create-post" id="openEventForm" type="button" style="display:none;">
      <span class="create-post-plus">＋</span>
      <span>Créer un évènement</span>
    </button>

    <!-- Formulaire Admin -->
    <section class="card event-form" id="eventForm" style="display:none; margin-top:12px;">
      <h2 style="margin:0 0 10px; color:var(--tidoc)">Nouvel évènement</h2>

      <label class="field">
        <span>Date</span>
        <input id="eventDate" type="date" />
      </label>

      <div class="event-row-2">
        <label class="field">
          <span>Début</span>
          <input id="eventStart" type="time" />
        </label>

        <label class="field">
          <span>Fin (optionnel)</span>
          <input id="eventEnd" type="time" />
        </label>
      </div>

      <label class="field">
        <span>Titre</span>
        <input id="eventTitle" type="text" placeholder="Ex : Workshop sutures" maxlength="80" />
      </label>

      <label class="field">
        <span>Lieu</span>
        <input id="eventPlace" type="text" placeholder="Ex : UMF Cluj — Salle B" maxlength="80" />
      </label>

      <label class="field">
        <span>Type</span>
        <select id="eventType">
          <option value="Conférence">Conférence</option>
          <option value="Workshop">Workshop</option>
          <option value="Autre">Autre</option>
        </select>
      </label>

      <label class="field">
        <span>Description</span>
        <textarea id="eventDesc" rows="4" placeholder="Détails utiles..." maxlength="900"></textarea>
      </label>

      <div class="form-actions">
        <button class="btn-outline" id="cancelEvent" type="button">Annuler</button>
        <button class="btn-primary" id="publishEvent" type="button">Publier</button>
      </div>

      <div id="eventMsg" style="margin-top:10px;font-size:13px;color:var(--muted)"></div>
    </section>

    <!-- Liste -->
    <section class="card" style="margin-top:12px;">
      <h2 style="margin:0;color:var(--tidoc)">Évènements</h2>
      <div id="eventsList" style="margin-top:12px;"></div>
    </section>

  </main>

  <!-- Tabbar -->
  <nav class="tabbar">
    <a class="tab" href="index.html" aria-label="Accueil">Accueil</a>
    <a class="tab" href="blog.html" aria-label="Forum">Forum</a>
    <a class="tab" href="galerie.html" aria-label="Galerie">Galerie</a>
    <a class="tab active" href="evenements.html" aria-label="Événements">Événements</a>
    <a class="tab" href="billets.html" aria-label="Billets">Billets</a>
  </nav>

  <!-- ✅ JS page -->
  <script type="module" src="evenements.js?v=7"></script>
  <script src="pwa.js"></script>
</body>
</html>
