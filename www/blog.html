<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ti'Doc — Forum</title>

  <link rel="stylesheet" href="style.css?v=10" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#178CA8" />

  <!-- Protège la page (redirige si pas connecté) -->
  <script type="module">
    import { requireAuthOrRedirect } from "./auth.js";
    requireAuthOrRedirect("./login.html");
  </script>
</head>

<body>
  <!-- ✅ Topbar + menu profil (avatar + cloche + menu) -->
  <script type="module" src="./header-user-menu.js"></script>

  <main class="page blog-page">

    <!-- ✅ Bouton créer un post (tout le monde connecté) -->
    <button class="create-post" id="createPostBtn" type="button">
      <span class="create-post-plus">＋</span>
      <span>Créer un post</span>
    </button>

    <!-- ✅ Formulaire (caché au départ) -->
    <section class="card post-form" id="postForm" style="display:none; margin-top:12px;">
      <h2 style="margin:0 0 10px;color:var(--tidoc)">Nouveau post</h2>

      <label class="field">
        <span>Titre</span>
        <input id="postTitle" type="text" placeholder="Ex : Workshop sutures — salle B" maxlength="80" />
      </label>

      <label class="field">
        <span>Contenu</span>
        <textarea id="postText" rows="5" placeholder="Écris l’info ici..." maxlength="800"></textarea>
      </label>

      <div class="form-actions">
        <button class="btn-outline" id="postCancel" type="button">Annuler</button>
        <button class="btn-primary" id="postSubmit" type="button">Publier</button>
      </div>

      <div id="postMsg" style="margin-top:10px;font-size:13px;color:var(--muted)"></div>
    </section>

    <!-- ✅ Feed des posts -->
    <section class="card" style="margin-top:12px;">
      <h2 style="margin:0;color:var(--tidoc)">Nouveaux posts</h2>
      <div id="postsRoot" style="margin-top:12px;"></div>
    </section>

  </main>

  <!-- Menu du bas -->
  <nav class="tabbar">
    <a class="tab" href="index.html" aria-label="Accueil">

    <a class="tab" href="galerie.html" aria-label="Galerie">...</a>

  <!-- ✅ Un seul JS forum -->
