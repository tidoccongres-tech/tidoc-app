<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ti'Doc — Billets</title>
  <link rel="stylesheet" href="style.css?v=204">
</head>

<body>

  <!-- ✅ Auth guard (dans le body = plus stable sur iPad) -->
  <script type="module">
    import { requireAuthOrRedirect } from "./auth.js";
    requireAuthOrRedirect("./login.html");
  </script>

  <!-- Topbar -->
  <script type="module" src="./header-user-menu.js?v=999"></script>

  <main class="page blog-page">

    <section class="card" id="ticketsCard">
      <h2 style="margin:0 0 6px; color:var(--tidoc);">Mon billet</h2>

      <p style="margin:0 0 12px; color:var(--muted); font-size:13px;">
        Télécharge ton billet HelloAsso (PDF ou capture). L’app extrait le QR + le pack.
      </p>

      <a class="btn-outline"
         id="openHelloAssoBtn"
         href="https://www.helloasso.com/associations/ti-doc/evenements/ti-doc-2026"
         target="_blank"
         rel="noopener noreferrer">
        Ouvrir HelloAsso
      </a>

      <div style="height:10px"></div>

      <button class="btn-primary" id="uploadTicketBtn" type="button">
        Télécharger mon billet
      </button>

      <input
        type="file"
        id="ticketFileInput"
        accept="application/pdf,image/*"
        style="display:none"
      />

      <p id="ticketStatus" style="margin:12px 0 0; color:var(--muted); font-size:13px;"></p>
    </section>

    <section class="card" style="margin-top:12px;">
      <div id="ticketBox">Aucun billet importé pour l’instant.</div>
    </section>

  </main>

  <!-- ✅ PDF.js (LEGACY = compatible Safari/iPad) -->
  <script src="https://unpkg.com/pdfjs-dist@3.11.174/legacy/build/pdf.min.js"></script>
  <script>
    window.pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://unpkg.com/pdfjs-dist@3.11.174/legacy/build/pdf.worker.min.js";
  </script>

  <!-- ✅ jsQR -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <!-- ✅ Ton script -->
  <script src="./billets.js?v=204"></script>

  <script src="pwa.js?v=2"></script>

</body>
</html>
