<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ti'Doc — Billets</title>
  <link rel="stylesheet" href="style.css?v=203">
</head>

<script type="module">
  import { requireAuthOrRedirect } from "./auth.js";
  requireAuthOrRedirect("./login.html");
</script>

<body>
  <!-- Topbar -->
  <script type="module" src="./header-user-menu.js"></script>

  <main class="page blog-page">

    <section class="card" id="ticketsCard">
      <h2 style="margin:0 0 6px; color:var(--tidoc);">Mon billet</h2>

      <p style="margin:0 0 12px; color:var(--muted); font-size:13px;">
        Télécharge ton billet HelloAsso (PDF ou capture). L’app extrait le QR + le pack.
      </p>

      <a class="btn-outline"
         id="openHelloAssoBtn"
         href="https://www.helloasso.com/associations/ti-doc/evenements/ti-doc-2026"
         target="_blank"
         rel="noopener noreferrer">
        Ouvrir HelloAsso
      </a>

      <div style="height:10px"></div>

      <!-- ✅ Bouton upload -->
      <button class="btn-primary" id="uploadTicketBtn" type="button">
        Télécharger mon billet
      </button>

      <!-- ✅ input caché (PDF / images) -->
      <input
         type="file"
         id="ticketFileInput"
         accept="application/pdf,image/*"
         style="display:none"
      />

      <p id="ticketStatus" style="margin:12px 0 0; color:var(--muted); font-size:13px;"></p>
    </section>

    <!-- Résultat -->
    <section class="card" style="margin-top:12px;">
      <div id="ticketBox">Aucun billet pour l’instant.</div>
    </section>

  </main>

  <nav class="tabbar">
    <a class="tab" href="index.html" aria-label="Accueil">Accueil</a>
    <a class="tab" href="blog.html" aria-label="Forum">Forum</a>
    <a class="tab" href="galerie.html" aria-label="Galerie">Galerie</a>
    <a class="tab" href="evenements.html" aria-label="Événements">Événements</a>
    <a class="tab active" href="billets.html" aria-label="Billets">Billets</a>
  </nav>

  <script type="module" src="./billets.js?v=203"></script>
  <script src="pwa.js"></script>
</body>
</html>
