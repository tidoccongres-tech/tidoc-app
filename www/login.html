<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ti’Doc – Connexion</title>

  <link rel="stylesheet" href="style.css?v=1000" />
  <meta name="theme-color" content="#178CA8" />
</head>

<body class="auth-page">
  <main class="auth-wrap">
    <section class="auth-card">

      <div class="auth-logo">
        <!-- change si tu veux -->
        <img src="./icons/icon-512.png" alt="Ti'Doc" />
      </div>

      <h1 class="auth-title">Ti’Doc</h1>
      <p class="auth-sub">Crée ton compte ou connecte-toi pour accéder à l’application.</p>

      <div class="auth-tabs">
        <button class="auth-tab active" type="button" data-tab="signup">Créer un compte</button>
        <button class="auth-tab" type="button" data-tab="login">Se connecter</button>
      </div>

      <!-- SIGNUP -->
      <div class="auth-panel" data-panel="signup">

        <div class="field-premium">
          <input id="signupPseudo" type="text" placeholder=" " autocomplete="username" />
          <label for="signupPseudo">Pseudo (ex : TiDoc26)</label>
          <span class="field-line"></span>
        </div>

        <!-- (optionnel) le JS crée aussi un hint s’il n’existe pas,
             mais tu peux le laisser ici pour maîtriser le style -->
        <div id="signupPseudoHint" class="auth-hint"></div>

        <div class="field-premium">
          <input id="signupEmail" type="email" placeholder=" " autocomplete="email" inputmode="email" />
          <label for="signupEmail">Email</label>
          <span class="field-line"></span>
        </div>

        <div class="field-premium has-eye">
          <input id="signupPassword" type="password" placeholder=" " autocomplete="new-password" />
          <label for="signupPassword">Mot de passe (6+)</label>
          <button class="pw-eye" type="button" data-target="signupPassword" aria-label="Afficher"></button>
          <span class="field-line"></span>
        </div>

        <button class="btn-premium btn-premium-primary auth-cta" id="signupBtn" type="button">
          Créer mon compte
        </button>

        <div class="auth-foot">
          En créant un compte, tu acceptes les règles de Ti’Doc (anti-spam, respect, etc.).
        </div>
      </div>

      <!-- LOGIN -->
      <div class="auth-panel" data-panel="login" style="display:none;">

        <div class="field-premium">
          <input id="loginEmail" type="email" placeholder=" " autocomplete="email" inputmode="email" />
          <label for="loginEmail">Email</label>
          <span class="field-line"></span>
        </div>

        <div class="field-premium has-eye">
          <input id="loginPassword" type="password" placeholder=" " autocomplete="current-password" />
          <label for="loginPassword">Mot de passe</label>
          <button class="pw-eye" type="button" data-target="loginPassword" aria-label="Afficher"></button>
          <span class="field-line"></span>
        </div>

        <button class="btn-premium btn-premium-primary auth-cta" id="loginBtn" type="button">
          Se connecter
        </button>

        <!-- Optionnel : si tu as activé le reset dans login.js -->
        <button class="btn-premium btn-premium-outline auth-reset" id="resetBtn" type="button">
          Mot de passe oublié
        </button>

      </div>

      <div id="authMsg" class="auth-msg"></div>
    </section>
  </main>

  <!-- ✅ Un seul JS -->
  <script type="module" src="./login.js?v=1000"></script>
</body>
</html>
