<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ti’Doc – Connexion</title>

  <meta name="theme-color" content="#178CA8" />
  <link rel="stylesheet" href="style.css?v=1000" />
  <!-- PWA -->
<link rel="manifest" href="/tidoc-app/www/manifest.json" />
<meta name="theme-color" content="#178CA8" />

<!-- Icônes -->
<link rel="icon" href="/tidoc-app/www/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/tidoc-app/www/icons/apple-touch-icon.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/tidoc-app/www/icons/apple-touch-icon.png" />

<!-- iOS standalone -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Ti'Doc" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
</head>

<body class="auth-page">
  <main class="auth-wrap" role="main">
    <section class="auth-card" aria-label="Connexion Ti’Doc">

      <!-- Logo (ne doit pas bloquer les taps : géré en CSS via pointer-events:none) -->
      <div class="auth-logo" aria-hidden="true">
        <img src="./icons/icon-512.png" alt="" />
      </div>

      <h1 class="auth-title">Ti’Doc</h1>
      <p class="auth-sub">Crée ton compte ou connecte-toi pour accéder à l’application.</p>

      <!-- Tabs (accessibles + pas de submit) -->
      <div class="auth-tabs" role="tablist" aria-label="Choix connexion / inscription">
        <button
          class="auth-tab active"
          type="button"
          id="tab-signup"
          role="tab"
          aria-selected="true"
          aria-controls="panel-signup"
          data-tab="signup">
          Créer un compte
        </button>

        <button
          class="auth-tab"
          type="button"
          id="tab-login"
          role="tab"
          aria-selected="false"
          aria-controls="panel-login"
          data-tab="login">
          Se connecter
        </button>
      </div>

      <!-- SIGNUP -->
      <section
        class="auth-panel"
        id="panel-signup"
        role="tabpanel"
        aria-labelledby="tab-signup"
        data-panel="signup">

        <div class="field-premium">
          <input id="signupPseudo" name="signupPseudo" type="text" placeholder=" " autocomplete="username" />
          <label for="signupPseudo">Pseudo (ex : TiDoc26)</label>
        </div>

        <div id="signupPseudoHint" class="auth-hint" aria-live="polite"></div>

        <div class="field-premium">
          <input id="signupEmail" name="signupEmail" type="email" placeholder=" " autocomplete="email" inputmode="email" />
          <label for="signupEmail">Email</label>
        </div>

        <div class="field-premium has-eye">
          <input id="signupPassword" name="signupPassword" type="password" placeholder=" " autocomplete="new-password" minlength="6" />
          <label for="signupPassword">Mot de passe (6+)</label>
          <button class="pw-eye" type="button" data-target="signupPassword" aria-label="Afficher / masquer le mot de passe"></button>
        </div>

        <button class="btn-premium btn-premium-primary auth-cta" id="signupBtn" type="button">
          Créer mon compte
        </button>

        <p class="auth-foot">
          En créant un compte, tu acceptes les règles de Ti’Doc (anti-spam, respect, etc.).
        </p>
      </section>

      <!-- LOGIN -->
      <section
        class="auth-panel"
        id="panel-login"
        role="tabpanel"
        aria-labelledby="tab-login"
        data-panel="login"
        hidden>

        <div class="field-premium">
          <input id="loginEmail" name="loginEmail" type="email" placeholder=" " autocomplete="email" inputmode="email" />
          <label for="loginEmail">Email</label>
        </div>

        <div class="field-premium has-eye">
          <input id="loginPassword" name="loginPassword" type="password" placeholder=" " autocomplete="current-password" />
          <label for="loginPassword">Mot de passe</label>
          <button class="pw-eye" type="button" data-target="loginPassword" aria-label="Afficher / masquer le mot de passe"></button>
        </div>

        <button class="btn-premium btn-premium-primary auth-cta" id="loginBtn" type="button">
          Se connecter
        </button>

        <button class="btn-premium btn-premium-outline auth-reset" id="resetBtn" type="button">
          Mot de passe oublié
        </button>
      </section>

      <!-- Messages -->
      <div id="authMsg" class="auth-msg" role="status" aria-live="polite"></div>
    </section>
  </main>

  <!-- ✅ Un seul script -->
  <script type="module" src="./login.js?v=1000"></script>
</body>
</html>
