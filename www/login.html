<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ti’Doc – Connexion</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#178CA8;
      animation: pageFade 320ms ease-out both;
    }

    .box{
      width:min(420px,92vw);
      background:#fff;
      border-radius:16px;
      padding:20px;
      padding-top:44px; /* place pour le logo */
      box-shadow:0 10px 30px rgba(0,0,0,.2);
      position:relative;
      animation: cardIn 420ms cubic-bezier(.2,.9,.2,1) both;
    }

    .auth-logo{
      position:absolute;
      top:-28px;
      left:50%;
      transform:translateX(-50%);
      width:56px;height:56px;
      border-radius:50%;
      background:#fff;
      border:1px solid rgba(0,0,0,.08);
      box-shadow:0 10px 24px rgba(0,0,0,.12);
      object-fit:cover;
      animation: logoPop 520ms cubic-bezier(.2,1.2,.2,1) both;
      animation-delay:120ms;
    }

    .logo{font-weight:800;font-size:26px;margin-bottom:6px}
    .sub{opacity:.75;margin-bottom:14px}

    .tabs{display:flex;gap:8px;margin:12px 0}
    .tab{flex:1;border:1px solid #ddd;border-radius:12px;padding:10px;background:#f6f6f6}
    .tab.active{border-color:#178CA8;background:#e9f7fb}

    .row{display:flex;flex-direction:column;gap:8px;margin:10px 0}
    input{padding:12px;border:1px solid #ddd;border-radius:12px;font-size:15px}

    button{padding:12px;border:none;border-radius:12px;background:#178CA8;color:#fff;font-weight:700}
    .link{background:transparent;color:#178CA8;text-decoration:underline}
    .small{font-size:13px;opacity:.75}

    @keyframes pageFade{
      from{opacity:0}
      to{opacity:1}
    }
    @keyframes cardIn{
      from{opacity:0; transform: translateY(18px) scale(.98);}
      to{opacity:1; transform: translateY(0) scale(1);}
    }
    @keyframes logoPop{
      0%{transform:translateX(-50%) scale(.7); opacity:0}
      60%{transform:translateX(-50%) scale(1.08); opacity:1}
      100%{transform:translateX(-50%) scale(1)}
    }
  </style>
</head>

<body>
  <div class="box">
    <img class="auth-logo" src="./icons/icon-512.png" alt="Ti'Doc">

    <div class="logo">Ti’Doc</div>
    <div class="sub">Crée ton compte ou connecte-toi pour accéder à l’application.</div>

    <div class="tabs">
      <button class="tab active" id="tabSignup" type="button">Créer un compte</button>
      <button class="tab" id="tabLogin" type="button">Se connecter</button>
    </div>

    <!-- SIGNUP -->
    <div id="signupPane">
      <div class="row">
        <input id="suName" placeholder="Pseudo (ex : TiDoc26)" />
        <div id="suNameStatus" class="small" style="margin-top:-4px;"></div>
        <input id="suEmail" placeholder="Email" inputmode="email" />
        <input id="suPass" placeholder="Mot de passe (6+)" type="password" />
        <button id="btnSignup" type="button">Créer mon compte</button>
        <div class="small">En créant un compte, tu acceptes les règles de Ti’Doc (anti-spam, respect, etc.).</div>
      </div>
    </div>

    <!-- LOGIN -->
    <div id="loginPane" style="display:none;">
      <div class="row">
        <input id="liEmail" placeholder="Email" inputmode="email" />
        <input id="liPass" placeholder="Mot de passe" type="password" />
        <button id="btnLogin" type="button">Se connecter</button>
        <button id="btnReset" class="link" type="button">Mot de passe oublié</button>
      </div>
    </div>

    <div id="msg" class="small" style="margin-top:10px;"></div>
  </div>

<script type="module">
  import { auth, db, signupEmail, loginEmail, resetPassword } from "./auth.js";
  import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";

  const LS_NAME = "tidoc_name";

  // ===== UI =====
  const tabSignup   = document.getElementById("tabSignup");
  const tabLogin    = document.getElementById("tabLogin");
  const signupPane  = document.getElementById("signupPane");
  const loginPane   = document.getElementById("loginPane");
  const msg         = document.getElementById("msg");

  const suName       = document.getElementById("suName");
  const suNameStatus = document.getElementById("suNameStatus");
  const btnSignup    = document.getElementById("btnSignup");

  // ===== Tabs =====
  function setTab(which){
    const s = which === "signup";
    tabSignup.classList.toggle("active", s);
    tabLogin.classList.toggle("active", !s);
    signupPane.style.display = s ? "" : "none";
    loginPane.style.display = s ? "none" : "";
    msg.textContent = "";
  }
  tabSignup.onclick = () => setTab("signup");
  tabLogin.onclick  = () => setTab("login");

  // ===== Redirect si déjà connecté =====
  onAuthStateChanged(auth, (u) => {
    if (u) window.location.href = "./index.html";
  });

  // ===== Username unique (LIVE) =====
  function normalizeUsername(v = "") {
    return v
      .trim()
      .toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-z0-9._-]/g, "");
  }

  const RESERVED = new Set(["admin", "moderateur", "mod", "support", "tidoc", "tidocteam"]);
  let nameCheckTimer = null;

  async function checkUsernameLive() {
    const raw = suName.value || "";
    const norm = normalizeUsername(raw);

    if (!norm) {
      suNameStatus.textContent = "";
      btnSignup.disabled = false;
      return { ok: true, norm: "" };
    }

    if (norm.length < 3) {
      suNameStatus.textContent = "❌ Pseudo trop court (min 3).";
      btnSignup.disabled = true;
      return { ok: false, norm };
    }

    if (RESERVED.has(norm)) {
      suNameStatus.textContent = "❌ Ce pseudo est réservé.";
      btnSignup.disabled = true;
      return { ok: false, norm };
    }

    suNameStatus.textContent = "⏳ Vérification…";
    btnSignup.disabled = true;

    try {
      const snap = await getDoc(doc(db, "usernames", norm));
      if (snap.exists()) {
        suNameStatus.textContent = "❌ Pseudo déjà pris.";
        btnSignup.disabled = true;
        return { ok: false, norm };
      } else {
        suNameStatus.textContent = "✅ Pseudo disponible.";
        btnSignup.disabled = false;
        return { ok: true, norm };
      }
    } catch (e) {
      console.log("checkUsernameLive error:", e);
      suNameStatus.textContent = "⚠️ Impossible de vérifier (réseau).";
      btnSignup.disabled = false; // tu peux mettre true si tu veux bloquer sans vérif
      return { ok: true, norm };
    }
  }

  suName?.addEventListener("input", () => {
    clearTimeout(nameCheckTimer);
    nameCheckTimer = setTimeout(checkUsernameLive, 250);
  });

  // ===== SIGNUP =====
  btnSignup.onclick = async () => {
    try {
      msg.textContent = "Création du compte…";

      // 1) check pseudo avant création
      const { ok } = await checkUsernameLive();
      if (!ok) return;

      // 2) créer compte
      const rawName = suName.value.trim();
      const displayName = rawName || "Utilisateur";
      const email = document.getElementById("suEmail").value.trim();
      const password = document.getElementById("suPass").value;

      await signupEmail({ email, password, displayName });

      // 3) cache local (pour header)
      localStorage.setItem(LS_NAME, displayName);
      window.dispatchEvent(new CustomEvent("tidoc:auth"));

      window.location.href = "./index.html";
    } catch (e) {
      msg.textContent = "Erreur: " + (e?.message || e);
    }
  };

  // ===== LOGIN =====
  document.getElementById("btnLogin").onclick = async () => {
    try {
      msg.textContent = "Connexion…";
      const email = document.getElementById("liEmail").value.trim();
      const password = document.getElementById("liPass").value;
      await loginEmail({ email, password });
      window.location.href = "./index.html";
    } catch (e) {
      msg.textContent = "Erreur: " + (e?.message || e);
    }
  };

  // ===== RESET =====
  document.getElementById("btnReset").onclick = async () => {
    const email = document.getElementById("liEmail").value.trim();
    if(!email) { msg.textContent = "Mets ton email d’abord."; return; }
    try {
      await resetPassword(email);
      msg.textContent = "Email de réinitialisation envoyé ✅";
    } catch (e) {
      msg.textContent = "Erreur: " + (e?.message || e);
    }
  };

  document.getElementById("btnSignup").onclick = async () => {
  try{
    msg.textContent = "Création du compte…";

    await checkUsernameLive();
    if (btnSignup.disabled) return;

    const displayName = document.getElementById("suName").value.trim();
    const email = document.getElementById("suEmail").value.trim();
    const password = document.getElementById("suPass").value;

    await signupEmail({ email, password, displayName });
    window.location.href = "./index.html";
  } catch(e){
    msg.textContent = "Erreur: " + (e?.message || e);
  }
};
  
</script>
</body>
</html>
