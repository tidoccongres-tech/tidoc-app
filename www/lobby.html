<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Lobby</title>
  <link rel="stylesheet" href="./lobby.css">
</head>

<body>
  <div class="lobby-root">

    <canvas id="gameCanvas"></canvas>

    <div class="ui">
      <div class="code">Code : <span id="roomCode">----</span></div>
      <div class="players" id="playersList"></div>
      <button id="btnStart" class="btn-start">Démarrer</button>
      <button id="btnLeave" class="btn-leave">Quitter</button>
    </div>

    <div class="chat" id="chat">
  <div class="chat-title">Chat</div>

  <div class="chat-messages" id="chatMessages"></div>

  <form class="chat-form" id="chatForm">
    <input id="chatInput" class="chat-input" type="text" placeholder="Écris un message…" autocomplete="off" />
    <button class="chat-send" type="submit">Envoyer</button>
  </form>
</div>
    
    <div class="joystick" id="joystick">
      <div class="stick"></div>
    </div>

  </div>

  <script type="module" src="./lobby.js"></script>
</body>
</html>
