<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Lobby</title>
  <link rel="stylesheet" href="./lobby.css">
</head>

<body>
  <div class="lobby-root">

    <!-- ✅ CANVAS -->
    <canvas id="gameCanvas"></canvas>

    <!-- ✅ UI -->
    <div class="ui">
      <div class="code">Code : <span id="roomCode">----</span></div>
      <div class="players" id="playersList"></div>
      <div id="startInfo" class="start-info" aria-live="polite"></div>

      <button id="btnStart" class="btn-start" type="button">Démarrer</button>
      <button id="btnLeave" class="btn-leave" type="button">Quitter</button>
    </div>

    <!-- ✅ Chat -->
    <button id="btnChatToggle" class="chat-fab" type="button" aria-label="Ouvrir le chat">
      <span class="badge" id="chatBadge" hidden></span>
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none"
           xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path opacity="0.5"
          d="M13.6288 20.4718L13.0867 21.3877C12.6035 22.204 11.3965 22.204 10.9133 21.3877L10.3712 20.4718C9.95073 19.7614 9.74049 19.4063 9.40279 19.2098C9.06509 19.0134 8.63992 19.0061 7.78958 18.9915C6.53422 18.9698 5.74689 18.8929 5.08658 18.6194C3.86144 18.1119 2.88807 17.1386 2.3806 15.9134C2 14.9946 2 13.8297 2 11.5V10.5C2 7.22657 2 5.58985 2.7368 4.38751C3.14908 3.71473 3.71473 3.14908 4.38751 2.7368C5.58985 2 7.22657 2 10.5 2H13.5C16.7734 2 18.4101 2 19.6125 2.7368C20.2853 3.14908 20.8509 3.71473 21.2632 4.38751C22 5.58985 22 7.22657 22 10.5V11.5C22 13.8297 22 14.9946 21.6194 15.9134C21.1119 17.1386 20.1386 18.1119 18.9134 18.6194C18.2531 18.8929 17.4658 18.9698 16.2104 18.9915C15.36 19.0061 14.9349 19.0134 14.5972 19.2098C14.2595 19.4062 14.0492 19.7614 13.6288 20.4718Z"
          fill="currentColor"/>
        <path d="M7.25 9C7.25 8.58579 7.58579 8.25 8 8.25H16C16.4142 8.25 16.75 8.58579 16.75 9C16.75 9.41421 16.4142 9.75 16 9.75H8C7.58579 9.75 7.25 9.41421 7.25 9Z"
          fill="currentColor"/>
        <path d="M7.25 12.5C7.25 12.0858 7.58579 11.75 8 11.75H13.5C13.9142 11.75 14.25 12.0858 14.25 12.5C14.25 12.9142 13.9142 13.25 13.5 13.25H8C7.58579 13.25 7.25 12.9142 7.25 12.5Z"
          fill="currentColor"/>
      </svg>
    </button>

  
    <!-- ✅ Bouton musique -->
    <div class="right-fabs">

  <!-- ✅ Bouton musique (EN HAUT) -->
  <button id="btnMusicToggle" class="music-fab" type="button" aria-label="Musique">
      <svg id="iconSoundOn" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M18.36,19.36a1,1,0,0,1-.7-.29,1,1,0,0,1,0-1.41,8,8,0,0,0,0-11.32,1,1,0,0,1,1.41-1.41,10,10,0,0,1,0,14.14A1,1,0,0,1,18.36,19.36Z"/>
        <path d="M15.54,16.54a1,1,0,0,1-.71-.3,1,1,0,0,1,0-1.41,4,4,0,0,0,0-5.66,1,1,0,0,1,1.41-1.41,6,6,0,0,1,0,8.48A1,1,0,0,1,15.54,16.54Z"/>
        <path d="M11.38,4.08a1,1,0,0,0-1.09.21L6.59,8H4a2,2,0,0,0-2,2v4a2,2,0,0,0,2,2H6.59l3.7,3.71A1,1,0,0,0,11,20a.84.84,0,0,0,.38-.08A1,1,0,0,0,12,19V5A1,1,0,0,0,11.38,4.08Z"/>
      </svg>
    
      <svg id="iconSoundOff" viewBox="0 0 24 24" aria-hidden="true" style="display:none;">
        <path d="M11.38,4.08a1,1,0,0,0-1.09.21L6.59,8H4a2,2,0,0,0-2,2v4a2,2,0,0,0,2,2H6.59l3.7,3.71A1,1,0,0,0,11,20a.84.84,0,0,0,.38-.08A1,1,0,0,0,12,19V5A1,1,0,0,0,11.38,4.08Z"/>
        <path d="M16,15.5a1,1,0,0,1-.71-.29,1,1,0,0,1,0-1.42l5-5a1,1,0,0,1,1.42,1.42l-5,5A1,1,0,0,1,16,15.5Z"/>
        <path d="M21,15.5a1,1,0,0,1-.71-.29l-5-5a1,1,0,0,1,1.42-1.42l5,5a1,1,0,0,1,0,1.42A1,1,0,0,1,21,15.5Z"/>
      </svg>
    </button>

      <button id="btnAdminStart" class="admin-fab" type="button" aria-label="Forcer démarrage">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path fill-rule="evenodd" clip-rule="evenodd"
      d="M15.9575 3H8.04251C7.56651 2.99998 7.14462 2.99996 6.78932 3.0324C6.4039 3.0676 6.02795 3.14535 5.65587 3.33907C5.2838 3.53279 5.00451 3.7962 4.75466 4.09176C4.52432 4.36424 4.28239 4.70989 4.00946 5.09982L3.38928 5.9858C2.97332 6.57997 2.63623 7.06146 2.40507 7.48985C2.15531 7.9527 1.97719 8.44362 1.99402 9.01492C2.01085 9.58621 2.21757 10.0658 2.49415 10.5131C2.75014 10.9272 3.11499 11.388 3.53186 11.9145L8.86406 18.6499C9.21107 19.0883 9.50591 19.4607 9.7686 19.7453C10.0411 20.0406 10.3437 20.3151 10.7291 20.4954C11.5345 20.872 12.4655 20.872 13.2709 20.4954C13.6563 20.3151 13.9589 20.0406 14.2314 19.7453C14.4941 19.4607 14.789 19.0882 15.1359 18.6499L20.4681 11.9145C20.885 11.388 21.2499 10.9272 21.5058 10.5131C21.7824 10.0658 21.9891 9.58621 22.006 9.01492C22.0228 8.44362 21.8447 7.9527 21.5949 7.48985C21.3638 7.06146 21.0267 6.57997 20.6415 6.02983L19.9905 5.09985C19.7176 4.7099 19.4757 4.36424 19.2453 4.09176C18.9955 3.7962 18.7162 3.53279 18.3441 3.33907C17.972 3.14535 17.5961 3.0676 17.2107 3.0324C16.8554 2.99996 16.4335 2.99998 15.9575 3Z"/>
  </svg>
</button>  

    <!-- ✅ Audio -->
    <audio id="lobbyMusic" src="./assets/lobby.mp3" loop preload="auto"></audio>

    <!-- ✅ Chat overlay -->
    <div id="chatOverlay" aria-hidden="true">
      <div class="chat-panel" role="dialog" aria-label="Chat">
        <div class="chat-head">
          <div class="chat-title">Chat</div>
          <button id="btnChatClose" class="chat-close" type="button" aria-label="Fermer">✕</button>
        </div>
        <div id="chatMessages"></div>
        <form id="chatForm" autocomplete="off">
          <input id="chatInput" type="text" placeholder="Écris un message…" autocomplete="off"
                 autocapitalize="sentences" autocorrect="on" spellcheck="true"/>
          <button type="submit">Envoyer</button>
        </form>
      </div>
    </div>

    <!-- ✅ Role overlay -->
    <div class="role-overlay" id="roleOverlay" aria-hidden="true">
      <div class="role-card">
        <div class="role-title" id="roleTitle">Tirage au sort…</div>
        <img id="roleImg" class="role-img" src="" alt="Rôle" />
        <div class="role-sub" id="roleSub">Ça tourne…</div>
        <button id="btnRoleOk" class="role-ok" type="button" style="display:none;">OK</button>
      </div>
    </div>

    <!-- ✅ Joystick -->
    <div class="joystick" id="joystick" aria-label="Joystick">
      <div class="stick"></div>
    </div>

    <script type="module" src="./lobby.js"></script>
  </div>

  <!-- ✅ REPORT overlay (hors root OK) -->
  <div id="reportOverlay" style="
    position:fixed; inset:0; z-index:250;
    display:none; align-items:center; justify-content:center;
    background: rgba(0,0,0,.65);
    backdrop-filter: blur(7px);
    -webkit-backdrop-filter: blur(7px);
  ">
    <div id="reportCard" style="
      width:min(520px, calc(100vw - 28px));
      border-radius:22px; padding:14px;
      background: rgba(0,0,0,.72);
      border:1px solid rgba(255,255,255,.14);
      box-shadow: 0 18px 50px rgba(0,0,0,.40);
      transform: translateY(18px) scale(.96);
      opacity: 0;
      color:#fff;
      font-family: system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    ">
      <div style="border-radius:18px; overflow:hidden; border:1px solid rgba(255,255,255,.12);">
        <img src="./assets/expulsion.png" alt="Expulsion" style="display:block;width:100%;height:auto;">
      </div>

      <div id="reportLine1" style="margin-top:12px; text-align:center; font:1000 18px system-ui;">
        Un Ti’Doc a été expulsé…
      </div>

      <div id="debatePill" style="margin-top:10px; display:none; text-align:center; font:900 13px system-ui; opacity:.92;">
        Débat : 60s
      </div>
    </div>
  </div>

</body>
</html>
