<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ti'Doc — Partenaires</title>

  <link rel="stylesheet" href="style.css?v=9" />
  <!-- Option: si tu veux isoler le style partenaires -->
  <link rel="stylesheet" href="partners.css?v=1" />
</head>

<body>
  <main class="page partners-page">
    <section class="card partners-hero">
      <div class="partners-hero-row">
        <div>
          <h1 class="partners-title">Partenaires</h1>
          <p class="partners-sub">
            Merci à ceux qui rendent Ti’Doc possible 🤍
          </p>
        </div>

        <!-- Admin only -->
        <button id="btnAddPartner" class="btn-premium btn-premium-primary partners-add" type="button" style="display:none;">
          + Ajouter
        </button>
      </div>

      <div class="partners-kpis" id="partnersKpis" style="display:none;">
        <div class="kpi">
          <div class="kpi-num" id="kpiCount">0</div>
          <div class="kpi-label">logos</div>
        </div>
        <div class="kpi">
          <div class="kpi-num">✨</div>
          <div class="kpi-label">premium</div>
        </div>
      </div>
    </section>

    <!-- Grid -->
    <section class="partners-grid" id="partnersGrid">
      <!-- skeleton injected -->
    </section>

    <!-- Empty -->
    <section class="card partners-empty" id="partnersEmpty" style="display:none;">
      <p style="margin:0;font-weight:900;color:var(--tidoc)">Aucun partenaire pour le moment</p>
      <p style="margin:8px 0 0;color:var(--muted);font-weight:700;">
        L’admin peut ajouter des logos dès que vous avez une collab.
      </p>
    </section>
  </main>

  <!-- tabbar déjà gérée via tes pages si tu la mets partout (sinon tu peux la recopier ici) -->

  <script type="module" src="./auth.js"></script>
  <script type="module" src="./header-user-menu.js"></script>
  <script type="module" src="./partners.js"></script>
</body>
</html>
