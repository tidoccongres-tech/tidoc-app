<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ti’Doc – Paramètres</title>
  <link rel="stylesheet" href="style.css?v=99" />

  <style>
    /* (1) force le style du bouton Home comme "avant" */
    .page-top-actions{
      position: sticky;
      top: 54px;              /* juste sous la barre bleue */
      z-index: 900;
      padding: 10px 0 0;
      background: var(--bg);  /* évite le chevauchement */
    }
    .home-icon-btn{
      width: 44px;
      height: 44px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(23,140,168,.12);
      color: var(--tidoc);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      box-shadow: 0 10px 24px rgba(0,0,0,.06);
    }
    .home-icon{
      width: 22px;
      height: 22px;
      display: block;
      color: currentColor;
    }

    /* (2) force le style des items de paramètres (pas violet/souligné) */
    .settings-item{
      display:block;
      border:1px solid var(--line);
      border-radius:14px;
      padding:14px;
      text-decoration:none;     /* <-- enlève souligné */
      background:#fff;
      box-shadow:0 10px 24px rgba(0,0,0,.06);
      margin-top:10px;
      color: inherit;           /* <-- enlève violet */
    }
    .settings-title{
      font-weight:900;
      color:var(--tidoc);
      margin-bottom:4px;
    }
    .settings-sub{
      font-size:13px;
      color:var(--muted);
      font-weight:700;
    }
  </style>
</head>

<body>
  <!-- Topbar + menu profil -->
  <script type="module" src="header-user-menu.js"></script>

  <main class="page blog-page">

    <!-- Home sous la topbar -->
    <div class="page-top-actions">
      <a class="home-icon-btn" href="./index.html" aria-label="Accueil">
        <svg class="home-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path fill-rule="evenodd" clip-rule="evenodd"
            d="M2.5192 7.82274C2 8.77128 2 9.91549 2 12.2039V13.725C2 17.6258 2 19.5763 3.17157 20.7881C4.34315 22 6.22876 22 10 22H14C17.7712 22 19.6569 22 20.8284 20.7881C22 19.5763 22 17.6258 22 13.725V12.2039C22 9.91549 22 8.77128 21.4808 7.82274C20.9616 6.87421 20.0131 6.28551 18.116 5.10812L16.116 3.86687C14.1106 2.62229 13.1079 2 12 2C10.8921 2 9.88939 2.62229 7.88403 3.86687L5.88403 5.10813C3.98695 6.28551 3.0384 6.87421 2.5192 7.82274ZM11.25 18C11.25 18.4142 11.5858 18.75 12 18.75C12.4142 18.75 12.75 18.4142 12.75 18V15C12.75 14.5858 12.4142 14.25 12 14.25C11.5858 14.25 11.25 14.5858 11.25 15V18Z"
            fill="currentColor"/>
        </svg>
      </a>
    </div>

    <!-- Titre -->
    <section class="card" style="margin-top:10px;">
      <h2 style="margin:0;color:var(--tidoc)">Paramètres</h2>
      <p style="margin:6px 0 0;color:var(--muted);font-size:13px">
        Gère ton compte Ti’Doc
      </p>
    </section>

    <!-- Options -->
    <section class="card" style="margin-top:12px;">
      <a class="settings-item" href="./profile.html">
        <div class="settings-title">Profil</div>
        <div class="settings-sub">Avatar, nom, infos</div>
      </a>
    </section>

  </main>
</body>
</html>
