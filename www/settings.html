<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ti’Doc – Paramètres</title>
  <link rel="stylesheet" href="style.css?v=1000" />
</head>

<body>
  <script type="module" src="header-user-menu.js"></script>

  <main class="page blog-page">
    <div class="page-top-actions">
      <a class="home-icon-btn" href="./index.html" aria-label="Accueil">
        <svg class="home-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path fill-rule="evenodd" clip-rule="evenodd"
            d="M2.5192 7.82274C2 8.77128 2 9.91549 2 12.2039V13.725C2 17.6258 2 19.5763 3.17157 20.7881C4.34315 22 6.22876 22 10 22H14C17.7712 22 19.6569 22 20.8284 20.7881C22 19.5763 22 17.6258 22 13.725V12.2039C22 9.91549 22 8.77128 21.4808 7.82274C20.9616 6.87421 20.0131 6.28551 18.116 5.10812L16.116 3.86687C14.1106 2.62229 13.1079 2 12 2C10.8921 2 9.88939 2.62229 7.88403 3.86687L5.88403 5.10813C3.98695 6.28551 3.0384 6.87421 2.5192 7.82274ZM11.25 18C11.25 18.4142 11.5858 18.75 12 18.75C12.4142 18.75 12.75 18.4142 12.75 18V15C12.75 14.5858 12.4142 14.25 12 14.25C11.5858 14.25 11.25 14.5858 11.25 15V18Z"
            fill="currentColor"/>
        </svg>
      </a>
    </div>

    <section class="card" style="margin-top:10px;">
      <h2 style="margin:0;color:var(--tidoc)">Paramètres</h2>
      <p style="margin:6px 0 0;color:var(--muted);font-size:13px">Gère ton compte Ti’Doc</p>
    </section>

    <section class="card profile-card" style="margin-top:12px;">
  <div class="profile-row">
    <div id="currentAvatar" class="profile-avatar-lg"></div>

    <div class="profile-info">
      <div class="profile-topline">
        <div id="profileName" class="profile-name"></div>
        <span id="adminBadge" class="profile-badge" style="display:none;">Admin</span>
      </div>
      <div id="profileEmail" class="profile-email"></div>

      <div class="profile-actions">
        <button class="btn-outline" id="changeAvatarBtn" type="button">
          Changer d’avatar
        </button>
      </div>
    </div>
  </div>
</section>

    <!-- ✅ NOUVEAU : changer mot de passe -->
    <section class="card security-card">
  <h2 class="security-title">Sécurité</h2>
  <div class="security-sub">Change ton mot de passe (ancien requis)</div>

  <div class="security-grid">
    <div class="sec-field">
      <label for="oldPass">Ancien mot de passe</label>
      <input id="oldPass" class="sec-input" type="password" placeholder="••••••••" autocomplete="current-password">
    </div>

    <div class="sec-field">
      <label for="newPass">Nouveau mot de passe</label>
      <input id="newPass" class="sec-input" type="password" placeholder="6 caractères minimum" autocomplete="new-password">
    </div>

    <div class="sec-field">
      <label for="newPass2">Confirmer le nouveau mot de passe</label>
      <input id="newPass2" class="sec-input" type="password" placeholder="Répète le nouveau mot de passe" autocomplete="new-password">
    </div>
  </div>

  <div class="security-actions">
    <button class="btn-primary" id="btnChangePwd" type="button">Modifier le mot de passe</button>
  </div>

  <div class="security-hint">
    Astuce : évite un mot de passe trop simple. Minimum 6 caractères, idéalement une phrase + chiffres.
  </div>

  <div id="pwdMsg" class="security-msg"></div>
</section>
  </main>

  <script type="module" src="settings.js?v=1000"></script>
</body>
</html>
