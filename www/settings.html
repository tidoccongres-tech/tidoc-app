<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ti’Doc – Paramètres</title>

  <link rel="stylesheet" href="style.css" />

  <button class="back-home-btn" id="backHomeBtn">
  ← Retour à l’accueil
</button>

<style>
    body{
      margin:0;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
      background:#f6f7f8;
    }

    .settings-page{
      display:flex;
      min-height:100vh;
    }

    /* menu gauche */
    .settings-nav{
      width:220px;
      background:#178CA8;
      color:#fff;
      padding:20px;
    }

    .settings-nav h2{
      margin:0 0 20px;
      font-size:20px;
    }

    .settings-link{
      display:block;
      padding:10px 12px;
      border-radius:10px;
      cursor:pointer;
      font-weight:600;
      background:rgba(255,255,255,.15);
    }

    /* contenu */
    .settings-content{
      flex:1;
      padding:24px;
    }

    .card{
      background:#fff;
      border-radius:16px;
      padding:20px;
      max-width:520px;
      box-shadow:0 10px 30px rgba(0,0,0,.08);
    }

    .avatar-grid{
      display:grid;
      grid-template-columns:repeat(5, 1fr);
      gap:12px;
      margin-top:16px;
    }

    .avatar-item{
      border-radius:50%;
      border:3px solid transparent;
      cursor:pointer;
      overflow:hidden;
    }

    .avatar-item img{
      width:100%;
      height:100%;
      display:block;
    }

    .avatar-item.selected{
      border-color:#178CA8;
    }
  </style>
</head>

<body>

<div class="settings-page">

  <!-- NAV -->
  <aside class="settings-nav">
    <h2>Paramètres</h2>
    <div class="settings-link">Profil</div>
  </aside>

  <!-- CONTENT -->
  <main class="settings-content">
    <div class="card">
      <h3>Profil</h3>
      <p>Choisis ton avatar Ti’Doc :</p>

      <div class="avatar-grid" id="avatarGrid"></div>
    </div>
  </main>

</div>

<script type="module" src="./settings.js"></script> 
  <script>
  document.getElementById("backHomeBtn")?.addEventListener("click", () => {
    window.location.href = "./index.html";
  });
</script>
  
</body>
</html>
