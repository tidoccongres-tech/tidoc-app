<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ti’Doc – Profil</title>
  <link rel="stylesheet" href="style.css?v=1" />
</head>

<body>
  <main class="page blog-page">
    <section class="card">
      <h2 style="margin:0;color:var(--tidoc)">Profil</h2>
      <p style="margin:8px 0 0;color:var(--muted);font-size:13px">
        Choisis ton avatar. Il s’affichera en haut à gauche dans l’application.
      </p>
    </section>

    <section class="card" style="margin-top:12px;">
      <div id="profileStatus" style="color:var(--muted);font-size:13px;margin-bottom:10px;"></div>

      <div id="avatarGrid" class="avatar-grid"></div>

      <div style="height:12px"></div>

      <button class="btn-primary" id="saveAvatarBtn" type="button" style="width:100%">
        Enregistrer mon avatar
      </button>
    </section>
  </main>

  <!-- Header commun -->
  <script type="module" src="header-user-menu.js?v=2"></script>
  <!-- Logique profil -->
  <script type="module" src="profile.js?v=2"></script>
</body>
</html>
