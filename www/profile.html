<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ti’Doc – Profil</title>
  <link rel="stylesheet" href="style.css?v=2" />
</head>

<body>

  <!-- Header commun (topbar + menu profil) -->
  <script type="module" src="header-user-menu.js"></script>

  <main class="page blog-page">

    <section class="card">
      <h2 style="margin:0;color:var(--tidoc)">Profil</h2>
      <p style="margin:6px 0 0;color:var(--muted);font-size:13px">
        Gère ton compte Ti’Doc
      </p>

      <div style="height:10px"></div>

      <!-- Retour accueil -->
      <a class="btn-outline" href="index.html" style="height:40px;">
        Accueil
      </a>
    </section>

    <section class="card" style="margin-top:12px;display:flex;gap:14px;align-items:center;">
      <!-- Avatar -->
      <img id="currentAvatar" class="profile-avatar" alt="Avatar" />

      <div style="flex:1">
        <!-- Nom modifiable -->
        <label style="font-size:12px;color:var(--muted);font-weight:700;">Nom</label>
        <input id="profileNameInput" type="text" placeholder="Ton nom" style="margin-top:6px;width:100%;" />

        <div style="height:10px"></div>

        <!-- Email (lecture seule) -->
        <div style="font-size:12px;color:var(--muted);font-weight:700;">Email</div>
        <div id="profileEmail" style="font-size:13px;color:var(--muted)"></div>

        <div style="height:12px"></div>

        <button class="btn-outline" id="changeAvatarBtn" type="button" style="height:40px;">
          Changer d’avatar
        </button>

        <div style="height:10px"></div>

        <button class="btn-primary" id="saveProfileBtn" type="button" style="height:44px;">
          Enregistrer
        </button>

        <div id="saveMsg" style="margin-top:10px;font-size:13px;color:var(--muted)"></div>
      </div>
    </section>

  </main>

  <script type="module" src="profile.js"></script>
</body>
</html>
