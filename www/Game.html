<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ti’Doc — MedUs</title>

  <link rel="stylesheet" href="./style.css?v=999" />
  <meta name="theme-color" content="#178CA8">

  <style>
    .game-wrap{display:flex;flex-direction:column;gap:12px}
    .game-title{margin:0;color:var(--tidoc);font-weight:950;font-size:20px}
    .game-sub{margin:0;color:var(--muted);font-weight:700;font-size:13px}
    .row{display:flex;gap:10px;flex-wrap:wrap}
    .row > *{flex:1;min-width:160px}
    .pill{display:inline-flex;align-items:center;gap:8px;padding:8px 10px;border-radius:999px;background:rgba(23,140,168,.08);border:1px solid rgba(23,140,168,.16);font-weight:850;font-size:12px;color:var(--tidoc)}
    .lobby-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
    .player{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:14px;background:rgba(0,0,0,.03);border:1px solid rgba(0,0,0,.06)}
    .player strong{font-weight:950}
    .badge{font-size:12px;font-weight:900;color:var(--muted)}
    .code{
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      padding:8px 10px;border-radius:12px;background:rgba(0,0,0,.05);border:1px solid rgba(0,0,0,.08);
      font-weight:900;letter-spacing:.8px;
    }
    .game-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
    .game-actions button{flex:1;min-width:180px}
    .hint{font-size:12px;color:var(--muted);font-weight:700;margin-top:8px}
  </style>
</head>

<body>

  <!-- Topbar -->
  <script type="module" src="./header-user-menu.js?v=999"></script>

  <main class="page blog-page">
    <section class="card game-wrap">
      <div>
        <h1 class="game-title">🩺 MedUs</h1>
        <p class="game-sub">Un mini-jeu social (version médecine) – V1 Lobby</p>
      </div>

      <div class="row">
        <button class="btn-primary" id="btnCreateRoom" type="button">Créer une partie</button>

        <div class="field" style="flex:2;min-width:220px">
          <label style="display:block;font-weight:900;color:var(--muted);font-size:12px;margin-bottom:6px">Code de partie</label>
          <input id="joinCode" placeholder="Ex: A7K2F1" maxlength="10" />
        </div>
        <button class="btn-outline" id="btnJoinRoom" type="button">Rejoindre</button>
      </div>

      <div id="gameMsg" class="hint"></div>
    </section>

    <section class="card" id="lobbyCard" style="display:none;margin-top:12px;">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">
        <div style="display:flex;flex-direction:column;gap:6px">
          <div class="pill">👥 Lobby</div>
          <div>Code : <span class="code" id="roomCodeText">—</span></div>
        </div>

        <div class="game-actions">
          <button class="btn-outline" id="btnCopyCode" type="button">Copier le code</button>
          <button class="btn-primary" id="btnStartGame" type="button">Lancer la partie</button>
          <button class="btn-outline" id="btnLeaveRoom" type="button">Quitter</button>
        </div>
      </div>

      <div class="hint">Astuce : partage le code aux autres participants.</div>

      <div class="lobby-list" id="playersList"></div>
    </section>

  </main>

  <!-- Tabbar (optionnel : si tu veux ajouter un onglet “Jeu”, je te le ferai) -->

  <script type="module" src="./auth.js"></script>
  <script type="module" src="./game.js?v=999"></script>
  <script src="./pwa.js"></script>

</body>
</html>
