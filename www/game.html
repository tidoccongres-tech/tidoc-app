    <source media="(min-aspect-ratio: 4/3)" srcset="assets/menu-landscape.png">
    <!-- Portrait sinon -->
    <source media="(max-aspect-ratio: 4/3)" srcset="assets/menu-portrait.png">
    <img src="assets/menu-portrait.png" alt="Menu Ti'Truant" />

  <!-- ✅ TITRE (menu principal) -->

       src="assets/Titre.png"

    <!-- SON COUPÉ -->
    <svg id="iconSoundOff" viewBox="0 0 24 24" aria-hidden="true" style="display:none;">

    </svg>
  </button>

  <!-- ✅ AUDIO (menu principal) -->
  <audio id="menuMusic" src="./assets/music/lobby.mp3" loop preload="auto"></audio>

  <!-- Boutons posés par-dessus -->
  <div class="menu-buttons">
    <button id="btnCreate" class="menu-btn btn-create" type="button" aria-label="Créer une partie">
      <img src="assets/bouton-creer.png" alt="" />
    </button>

    <button id="btnJoin" class="menu-btn btn-join" type="button" aria-label="Rejoindre une partie">
      <img src="assets/bouton-rejoindre.png" alt="" />
    </button>

    <button id="btnHome" class="menu-btn btn-home" type="button" aria-label="Menu home">

  </div>
