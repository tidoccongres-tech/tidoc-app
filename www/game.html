<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Ti'Doc — Ti'Truant</title>

  <link rel="stylesheet" href="./style.css?v=999">
  <link rel="stylesheet" href="./game.css?v=1010">
</head>

<body class="game-body">

  <!-- ✅ MENU FULLSCREEN -->
  <main class="menu-root" id="menuRoot">

    <!-- Fond responsive -->
    <picture class="menu-bg">
  <!-- Landscape si écran "large" -->
  <source media="(min-aspect-ratio: 4/3)" srcset="assets/menu-landscape.png">
  <!-- Portrait sinon -->
  <source media="(max-aspect-ratio: 4/3)" srcset="assets/menu-portrait.png">
  <img src="assets/menu-portrait.png" alt="Menu Ti'Truant" />
</picture>

    <!-- Boutons posés par-dessus -->
    <div class="menu-buttons">
      <button id="btnCreate" class="menu-btn btn-create" type="button" aria-label="Créer une partie">
        <img src="assets/bouton-creer.png" alt="" />
      </button>

      <button id="btnJoin" class="menu-btn btn-join" type="button" aria-label="Rejoindre une partie">
        <img src="assets/bouton-rejoindre.png" alt="" />
      </button>

      <button id="btnHome" class="menu-btn btn-home" type="button" aria-label="Menu home">
        <img src="assets/bouton-home.png" alt="" />
      </button>
    </div>

  </main>

  <!-- garde auth + game.js pour la logique -->
  <script type="module" src="./auth.js"></script>
  <script type="module" src="./game.js?v=999"></script>
</body>
</html>
