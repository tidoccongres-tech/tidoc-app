<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Ti'Doc — Ti'Truant</title>

  <!-- tu peux garder style.css si tu veux la topbar etc -->
  <link rel="stylesheet" href="./style.css?v=999">
  <link rel="stylesheet" href="./game.css?v=999">
</head>

<body>
  <script type="module" src="./header-user-menu.js?v=999"></script>

  <main class="page blog-page">

    <!-- ÉCRAN 1 : MENU (ton PNG dessiné) -->
    <section id="screenMenu" class="card game-menu-card">
      <div class="menu-stage">
        <img src="www/assets/menu-portrait.png" alt="Menu Ti'Truant" class="menu-img">

        <!-- zones cliquables -->
        <button id="btnCreate" class="menu-hotspot hs-create" aria-label="Créer une partie"></button>
        <button id="btnJoin"   class="menu-hotspot hs-join"   aria-label="Rejoindre une partie"></button>
        <button id="btnHome"   class="menu-hotspot hs-home"   aria-label="Retour accueil"></button>
      </div>
    </section>

    <!-- ÉCRAN 2 : LOBBY Firebase -->
    <section id="screenLobby" class="card lobby-card-premium" style="display:none;">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">
        <div style="display:flex;flex-direction:column;gap:6px">
          <div class="pill">👥 Lobby</div>
          <div>Code : <span class="code" id="roomCodeText">—</span></div>
          <div class="hint" id="roomStatusText">Statut : —</div>
          <div class="hint" id="gameMsg" style="margin-top:6px"></div>
        </div>

        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn-outline" id="btnCopyCode" type="button">Copier le code</button>
          <button class="btn-outline" id="btnLeaveRoom" type="button">Quitter</button>
        </div>
      </div>

      <div class="hint" style="margin-top:10px">Astuce : partage le code aux autres participants.</div>
      <div class="lobby-list" id="playersList" style="margin-top:10px"></div>
    </section>

  </main>

  <script type="module" src="./auth.js"></script>
  <script type="module" src="./game.js?v=999"></script>
</body>
</html>
