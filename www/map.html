<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Ti’Doc — Map</title>
  <link rel="stylesheet" href="./style.css?v=999" />
  <link rel="stylesheet" href="./map.css?v=999" />
  <meta name="theme-color" content="#178CA8">
  <!-- PWA -->
<link rel="manifest" href="/tidoc-app/www/manifest.json" />
<meta name="theme-color" content="#178CA8" />

<!-- Icônes -->
<link rel="icon" href="/tidoc-app/www/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/tidoc-app/www/icons/apple-touch-icon.png" />

<!-- iOS standalone -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Ti'Doc" />

<body class="map-body">
  <script type="module" src="./header-user-menu.js?v=999"></script>

  <main class="map-root">
    <canvas id="gameCanvas"></canvas>

    <!-- mini HUD -->
    <div class="hud">
      <div class="hud-pill">👥 <span id="hudPlayers">0</span></div>
      <div class="hud-pill">📍 <span id="hudRoom">—</span></div>
      <button class="hud-btn" id="btnBack">Lobby</button>
    </div>
  </main>

  <script type="module" src="./auth.js"></script>
  <script type="module" src="./map-scene.js?v=999"></script>
</body>
</html>
